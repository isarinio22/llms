[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llms"
version = "0.1.0"
description = "Replace an expensive LLM with a small model you own: distillation, LoRA, rigorous evaluation, a confidence cascade and efficient serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "isarinio22" }]

[project.urls]
Repository = "https://github.com/isarinio22/llms"

[project.scripts]
llms = "llms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads a tiny model from the Hugging Face Hub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
